# Joint-space waypoints of the apple relay (radians; the last value of each pose is the
# RG6 finger_joint: -0.40 open, 0.102 holds an apple of 80 mm).
#   move  seconds to reach the waypoint from the previous one (the first comes from the last)
#   hold  seconds to stay at the waypoint
#   grasp / release  the robot takes the apple from / leaves it at this spot on arrival
# The loop repeats; 'offset' shifts each robot so that the apple passes cr35_1 -> ur20_1 ->
# ur20_2 -> cr35_2 -> cr35_1. The first waypoint is also the pose for animate:=false.
#
# Generated by compute_relay.py (planning folder, log/plans/assets/2026-09-30_gripper/)
# for cell_layout.yaml of 2026-09-30. Cycle 36.8 s, one hand-over every 9.2 s.
# Checked: grasp point never below the apple centre over the table; closest approach
# between two robots 0.66 m.
